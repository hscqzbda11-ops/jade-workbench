<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Jade 工作台</title>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jade工作台">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json?v=4">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { ink: '#1a1a1a', paper: '#f5f5f5', ash: '#8a8a8a', fog: '#e5e5e5', mist: '#f0f0f0' },
      fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','"PingFang SC"','"Helvetica Neue"','sans-serif'] },
      borderRadius: { 'xl': '1rem','2xl':'1.25rem','3xl':'1.75rem' }
    }
  }
}
</script>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="bg-paper text-ink font-sans">

<!-- ========== App Container ========== -->
<div id="app" class="min-h-screen pb-20" style="padding-top:env(safe-area-inset-top)">

<!-- ========== 首页 ========== -->
<section id="page-home" class="page active">
  <div class="px-5 pt-6 pb-3">
    <h1 class="text-2xl font-bold tracking-tight">Jade 工作台</h1>
    <p class="text-xs text-ash mt-1">点击日期快速跳转 · 图标标识当日完成情况</p>
  </div>

  <!-- 日历 -->
  <div class="mx-4 mb-5 bg-white rounded-3xl p-4 shadow-sm">
    <div class="flex items-center justify-between mb-3">
      <button onclick="Calendar.prev()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-fog text-lg">‹</button>
      <span id="cal-title" class="text-base font-semibold">2026年8月</span>
      <button onclick="Calendar.next()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-fog text-lg">›</button>
    </div>
    <div class="grid grid-cols-7 gap-1 mb-1">
      <div class="text-center text-[10px] text-ash font-medium py-1">日</div>
      <div class="text-center text-[10px] text-ash font-medium py-1">一</div>
      <div class="text-center text-[10px] text-ash font-medium py-1">二</div>
      <div class="text-center text-[10px] text-ash font-medium py-1">三</div>
      <div class="text-center text-[10px] text-ash font-medium py-1">四</div>
      <div class="text-center text-[10px] text-ash font-medium py-1">五</div>
      <div class="text-center text-[10px] text-ash font-medium py-1">六</div>
    </div>
    <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
    <div class="flex gap-5 mt-3 text-[10px] text-ash">
      <span>$ 理财记账</span>
      <span>👣 任务完成</span>
    </div>
  </div>

  <!-- 快捷入口 -->
  <div class="px-4 mb-5">
    <h2 class="text-sm font-semibold text-gray-700 mb-2">快捷入口</h2>
    <div class="grid grid-cols-2 gap-3">
      <button onclick="Nav.go('finance');Finance.openAddRecord()" class="bg-white rounded-2xl py-4 flex flex-col items-center gap-1 shadow-sm active:scale-95 transition">
        <span class="text-2xl">$</span><span class="text-xs font-medium">理财记账</span>
      </button>
      <button onclick="Nav.go('todo');Todo.openAdd()" class="bg-white rounded-2xl py-4 flex flex-col items-center gap-1 shadow-sm active:scale-95 transition">
        <span class="text-2xl">✓</span><span class="text-xs font-medium">任务清单</span>
      </button>
    </div>
  </div>

  <!-- 今日概览 -->
  <div class="px-4 mb-5">
    <h2 class="text-sm font-semibold text-gray-700 mb-2">今日概览</h2>
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl p-3 shadow-sm text-center">
        <div class="text-[10px] text-ash mb-1">剩余待办</div>
        <div class="text-xl font-bold" id="stat-todo">0</div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm text-center">
        <div class="text-[10px] text-ash mb-1">收支总金额</div>
        <div class="text-xl font-bold" id="stat-finance">¥0</div>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm text-center">
        <div class="text-[10px] text-ash mb-1">升本学习</div>
        <div class="text-xl font-bold" id="stat-study">0</div>
      </div>
    </div>
  </div>

  <!-- 最新动态 -->
  <div class="px-4 mb-5">
    <h2 class="text-sm font-semibold text-gray-700 mb-2">最新动态</h2>
    <div id="latest-activity" class="space-y-2"></div>
  </div>

  <!-- 数据管理 -->
  <div class="px-4 mb-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-2">数据管理</h2>
    <div class="flex gap-3">
      <button onclick="exportData()" class="flex-1 bg-white rounded-2xl py-3 shadow-sm active:scale-95 transition">
        <div class="text-lg mb-0.5">⬇</div>
        <div class="text-[10px] text-ash">导出备份</div>
      </button>
      <label class="flex-1 bg-white rounded-2xl py-3 shadow-sm active:scale-95 transition cursor-pointer">
        <div class="text-lg mb-0.5 text-center">⬆</div>
        <div class="text-[10px] text-ash text-center">导入恢复</div>
        <input type="file" accept=".json" class="hidden" onchange="importDataFromFile(this.files[0]);this.value=''">
      </label>
    </div>
  </div>
</section>

<!-- ========== 待办清单 ========== -->
<section id="page-todo" class="page hidden">
  <div class="px-5 pt-6 pb-3 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold">今日任务</h1>
      <p class="text-xs text-ash mt-1" id="todo-date-label"></p>
    </div>
    <button onclick="Todo.openAdd()" class="w-9 h-9 bg-ink text-white rounded-full flex items-center justify-center text-lg active:scale-90">+</button>
  </div>
  <div id="todo-list" class="px-4"></div>
</section>

<!-- ========== 理财 ========== -->
<section id="page-finance" class="page hidden">
  <div class="px-5 pt-6 pb-3">
    <h1 class="text-2xl font-bold">理财</h1>
  </div>
  <!-- 资产卡片 -->
  <div class="px-4 mb-4">
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-2xl p-3 shadow-sm relative">
        <div class="text-[10px] text-ash">风险投资</div>
        <div class="text-base font-bold mt-1" id="asset-risk-total">¥0</div>
        <button onclick="Finance.togglePanel('risk')" class="absolute bottom-2 right-2 w-5 h-5 bg-fog rounded-full flex items-center justify-center text-xs">+</button>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm relative">
        <div class="text-[10px] text-ash">固定资产</div>
        <div class="text-base font-bold mt-1" id="asset-fixed-total">¥0</div>
        <button onclick="Finance.togglePanel('fixed')" class="absolute bottom-2 right-2 w-5 h-5 bg-fog rounded-full flex items-center justify-center text-xs">+</button>
      </div>
      <div class="bg-white rounded-2xl p-3 shadow-sm relative">
        <div class="text-[10px] text-ash">日常开销</div>
        <div class="text-base font-bold mt-1" id="asset-daily-total">¥0</div>
        <div class="text-[10px] text-ash mt-1 leading-tight" id="daily-budget-info">本月预算：设置后可见</div>
        <button onclick="Finance.togglePanel('daily')" class="absolute top-3 right-2 w-5 h-5 bg-fog rounded-full flex items-center justify-center text-xs">+</button>
      </div>
    </div>
    <!-- 伸缩面板 -->
    <div id="asset-panel" class="hidden mt-2 bg-white rounded-2xl p-3 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-gray-600" id="asset-panel-title">编辑资产</span>
        <button onclick="Finance.closePanel()" class="text-xs text-ash">收起</button>
      </div>
      <div id="asset-panel-content"></div>
    </div>
  </div>

  <!-- 资产明细（折叠） -->
  <div class="px-4 mb-4">
    <button onclick="Finance.toggleDetails()" class="w-full bg-white rounded-2xl p-3 shadow-sm flex items-center justify-between">
      <span class="text-xs font-semibold text-gray-600">资产明细</span>
      <span class="text-xs text-ash" id="details-toggle">展开 ▾</span>
    </button>
    <div id="asset-details" class="hidden mt-2 space-y-2"></div>
  </div>

  <!-- 收支月历 -->
  <div class="px-4 mb-4">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <button onclick="Finance.prevMonth()" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-fog">‹</button>
        <span id="fin-cal-title" class="text-sm font-semibold">2026年8月</span>
        <button onclick="Finance.nextMonth()" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-fog">›</button>
      </div>
      <div id="fin-cal-grid" class="grid grid-cols-7 gap-1"></div>
      <button onclick="Finance.openAddRecord()" class="mt-3 w-full py-2 bg-ink text-white rounded-xl text-xs font-medium active:scale-95">+ 新增记账</button>
    </div>
  </div>

  <!-- 收支记录 -->
  <div class="px-4 mb-4">
    <h2 class="text-sm font-semibold text-gray-700 mb-2">收支记录</h2>
    <div id="finance-records" class="space-y-2"></div>
  </div>

  <!-- 收支统计图 -->
  <div class="px-4 mb-4">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <div class="text-xs font-semibold text-gray-600 mb-2">收支统计</div>
      <div id="finance-chart" class="flex items-end justify-between h-20 gap-1"></div>
    </div>
  </div>

  <!-- 存钱计划 -->
  <div class="px-4 mb-6">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-sm font-semibold text-gray-700">存钱计划</h2>
      <button onclick="Finance.openAddPlan()" class="w-5 h-5 bg-fog rounded-full flex items-center justify-center text-xs">+</button>
    </div>
    <div id="savings-plans" class="space-y-2"></div>
  </div>
</section>

<!-- ========== 我与世界 ========== -->
<section id="page-world" class="page hidden">
  <div class="px-5 pt-6 pb-3">
    <h1 class="text-2xl font-bold">我与世界</h1>
    <p class="text-xs text-ash mt-1" id="world-update-time">加载中...</p>
  </div>
  <div class="px-4 mb-3 overflow-x-auto" style="-webkit-overflow-scrolling:touch">
    <div id="world-tabs" class="flex gap-2 pb-1 whitespace-nowrap"></div>
  </div>
  <div id="world-news-list" class="px-4 space-y-3"></div>
  <div class="text-center py-8 text-xs text-ash" id="world-loading">正在抓取最新资讯...</div>
</section>

<!-- ========== 专升本专区 ========== -->
<section id="page-edu" class="page hidden">
  <div class="px-5 pt-6 pb-3">
    <h1 class="text-2xl font-bold">专升本专区</h1>
    <p class="text-xs text-ash mt-1" id="edu-update-time">加载中...</p>
  </div>
  <div class="px-4 mb-3 overflow-x-auto" style="-webkit-overflow-scrolling:touch">
    <div id="edu-tabs" class="flex gap-2 pb-1 whitespace-nowrap"></div>
  </div>
  <div id="edu-content" class="px-4 space-y-3"></div>
  <div class="text-center py-8 text-xs text-ash" id="edu-loading">正在抓取最新资讯...</div>
</section>

<!-- ========== 我的收藏 ========== -->
<section id="page-fav" class="page hidden">
  <div class="px-5 pt-6 pb-3">
    <h1 class="text-2xl font-bold">我的收藏</h1>
    <p class="text-xs text-ash mt-1" id="fav-count-label"></p>
  </div>
  <div class="px-4 mb-3 overflow-x-auto" style="-webkit-overflow-scrolling:touch">
    <div class="flex gap-2 pb-1 whitespace-nowrap">
      <button onclick="Favorites.setTab('world')" class="fav-tab active px-4 py-1.5 rounded-full text-xs font-medium">我与世界</button>
      <button onclick="Favorites.setTab('edu')" class="fav-tab px-4 py-1.5 rounded-full text-xs font-medium">专升本</button>
      <button onclick="Favorites.setTab('finance')" class="fav-tab px-4 py-1.5 rounded-full text-xs font-medium">理财/存钱</button>
      <button onclick="Favorites.setTab('todo')" class="fav-tab px-4 py-1.5 rounded-full text-xs font-medium">待办任务</button>
    </div>
  </div>
  <div id="fav-list" class="px-4 space-y-3"></div>
</section>

</div><!-- /app -->

<!-- ========== 底部导航 ========== -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-fog flex justify-around items-center py-2 z-50" style="padding-bottom:env(safe-area-inset-bottom)">
  <button onclick="Nav.go('home')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="home">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
    <span class="text-[9px]">首页</span>
  </button>
  <button onclick="Nav.go('todo')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="todo">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span class="text-[9px]">待办</span>
  </button>
  <button onclick="Nav.go('finance')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="finance">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8c-2 0-3 1-3 2s1 2 3 2 3 1 3 2-1 2-3 2m0-10v2m0 8v2M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
    <span class="text-[9px]">理财</span>
  </button>
  <button onclick="Nav.go('world')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="world">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
    <span class="text-[9px]">世界</span>
  </button>
  <button onclick="Nav.go('edu')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="edu">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 7l10-4 10 4-10 4L2 7zm0 5l10 4 10-4M2 17l10 4 10-4"/></svg>
    <span class="text-[9px]">专升本</span>
  </button>
  <button onclick="Nav.go('fav')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="fav">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0016.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 002 8.5c0 2.29 1.51 4.04 3 5.5l7 7 7-7z"/></svg>
    <span class="text-[9px]">收藏</span>
  </button>
</nav>

<!-- ========== 模态容器 ========== -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/30 z-[100] flex items-end" onclick="Modal.close(event)">
  <div id="modal-box" class="bg-white w-full rounded-t-3xl p-5 max-h-[80vh] overflow-y-auto" style="padding-bottom:calc(env(safe-area-inset-bottom) + 20px)" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
  </div>
</div>

<!-- ========== Toast ========== -->
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-ink text-white px-4 py-2 rounded-xl text-xs z-[200]"></div>

<!-- ========== Scripts ========== -->
<script src="js/storage.js?v=4"></script>
<script src="js/app.js?v=4"></script>
<script src="js/todo.js?v=4"></script>
<script src="js/finance.js?v=4"></script>
<script src="js/news.js?v=4"></script>
<script src="js/favorites.js?v=4"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=4').catch(()=>{});
}
App.init();
</script>
</body>
</html>
