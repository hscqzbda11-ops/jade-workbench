<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Jade</title>
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jade">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json?v=11">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { ink: '#000', paper: '#fff', ash: '#999', fog: '#eee', mist: '#f7f7f7', line: '#e5e5e5' },
      fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','"PingFang SC"','"Helvetica Neue"','sans-serif'] }
    }
  }
}
</script>
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body class="bg-white text-black font-sans">

<!-- ========== App Container ========== -->
<div id="app" class="min-h-screen pb-24" style="padding-top:env(safe-area-inset-top)">

<!-- ========== 首页 ========== -->
<section id="page-home" class="page active">
  <div class="px-5 pt-8 pb-5">
    <h1 class="text-2xl font-bold tracking-tight">Jade</h1>
    <p class="text-xs text-ash mt-1" id="home-date"></p>
  </div>

  <!-- 日历 -->
  <div class="px-5 mb-6">
    <div class="flex items-center justify-between mb-3">
      <button onclick="Calendar.prev()" class="w-8 h-8 flex items-center justify-center text-lg text-ash">‹</button>
      <span id="cal-title" class="text-sm font-semibold"></span>
      <button onclick="Calendar.next()" class="w-8 h-8 flex items-center justify-center text-lg text-ash">›</button>
    </div>
    <div class="grid grid-cols-7 gap-0 mb-1">
      <div class="text-center text-[10px] text-ash py-1">日</div>
      <div class="text-center text-[10px] text-ash py-1">一</div>
      <div class="text-center text-[10px] text-ash py-1">二</div>
      <div class="text-center text-[10px] text-ash py-1">三</div>
      <div class="text-center text-[10px] text-ash py-1">四</div>
      <div class="text-center text-[10px] text-ash py-1">五</div>
      <div class="text-center text-[10px] text-ash py-1">六</div>
    </div>
    <div id="cal-grid" class="grid grid-cols-7 gap-0"></div>
  </div>

  <!-- 快捷入口 -->
  <div class="px-5 mb-6">
    <div class="grid grid-cols-2 gap-3">
      <button onclick="Nav.go('finance');Finance.openAddRecord()" class="border border-line rounded-xl py-5 flex flex-col items-center gap-1 active:bg-mist transition">
        <span class="text-2xl font-bold">$</span>
        <span class="text-xs">记账</span>
      </button>
      <button onclick="Nav.go('todo');Todo.openAdd()" class="border border-line rounded-xl py-5 flex flex-col items-center gap-1 active:bg-mist transition">
        <span class="text-2xl">👣</span>
        <span class="text-xs">待办</span>
      </button>
    </div>
  </div>

  <!-- 今日概览 -->
  <div class="px-5 mb-6">
    <div class="grid grid-cols-3 gap-0 border-t border-line">
      <div class="text-center py-3 border-r border-line">
        <div class="text-[10px] text-ash">待办</div>
        <div class="text-base font-bold mt-0.5" id="stat-todo">0</div>
      </div>
      <div class="text-center py-3 border-r border-line">
        <div class="text-[10px] text-ash">今日收支</div>
        <div class="text-base font-bold mt-0.5" id="stat-finance">¥0</div>
      </div>
      <div class="text-center py-3">
        <div class="text-[10px] text-ash">升本学习</div>
        <div class="text-base font-bold mt-0.5" id="stat-study">0</div>
      </div>
    </div>
  </div>

  <!-- 数据备份 -->
  <div class="px-5 mb-8">
    <button onclick="exportData()" class="w-full border border-black rounded-lg py-3 text-sm font-medium active:bg-mist transition">
      备份全部数据
    </button>
    <div class="flex gap-2 mt-2">
      <label class="flex-1 border border-line rounded-lg py-2.5 cursor-pointer active:bg-mist transition">
        <div class="text-xs text-center">导入恢复</div>
        <input type="file" accept=".json" class="hidden" onchange="importDataFromFile(this.files[0]);this.value=''">
      </label>
      <button onclick="App.clearAllData()" class="flex-1 border border-line rounded-lg py-2.5 active:bg-mist transition">
        <div class="text-xs text-center text-ash">清空数据</div>
      </button>
    </div>
  </div>
</section>

<!-- ========== 待办清单 ========== -->
<section id="page-todo" class="page hidden">
  <div class="px-5 pt-8 pb-3 flex items-center justify-between">
    <h1 class="text-2xl font-bold tracking-tight">待办</h1>
    <button onclick="Todo.openAdd()" class="w-8 h-8 border border-black rounded-full flex items-center justify-center text-lg active:bg-mist">+</button>
  </div>
  <div id="todo-list" class="px-5 pb-4"></div>
</section>

<!-- ========== 理财 ========== -->
<section id="page-finance" class="page hidden">
  <div class="px-5 pt-8 pb-3 flex items-center justify-between">
    <h1 class="text-2xl font-bold tracking-tight">理财</h1>
    <button onclick="Finance.openAddRecord()" class="w-8 h-8 border border-black rounded-full flex items-center justify-center text-lg active:bg-mist">+</button>
  </div>
  <!-- 资产概览 -->
  <div class="px-5 mb-5">
    <div class="grid grid-cols-3 gap-0 border-t border-b border-line">
      <div class="py-3 border-r border-line relative">
        <div class="text-[10px] text-ash text-center">风险投资</div>
        <div class="text-sm font-bold mt-0.5 text-center" id="asset-risk-total">¥0</div>
        <button onclick="Finance.togglePanel('risk')" class="absolute top-2 right-1 text-xs text-ash">+</button>
      </div>
      <div class="py-3 border-r border-line relative">
        <div class="text-[10px] text-ash text-center">固定资产</div>
        <div class="text-sm font-bold mt-0.5 text-center" id="asset-fixed-total">¥0</div>
        <button onclick="Finance.togglePanel('fixed')" class="absolute top-2 right-1 text-xs text-ash">+</button>
      </div>
      <div class="py-3 relative">
        <div class="text-[10px] text-ash text-center">日常开销</div>
        <div class="text-base font-bold mt-0.5 text-center" id="asset-daily-total">¥0</div>
        <div class="text-[9px] text-ash mt-0.5 text-center leading-tight" id="daily-budget-info">设置预算</div>
        <button onclick="Finance.togglePanel('daily')" class="absolute top-2 right-1 text-xs text-ash">+</button>
      </div>
    </div>
    <!-- 伸缩面板 -->
    <div id="asset-panel" class="hidden mt-2 border border-line rounded-lg p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold" id="asset-panel-title">编辑资产</span>
        <button onclick="Finance.closePanel()" class="text-xs text-ash">收起</button>
      </div>
      <div id="asset-panel-content"></div>
    </div>
  </div>

  <!-- 资产明细（折叠） -->
  <div class="px-5 mb-4">
    <button onclick="Finance.toggleDetails()" class="w-full py-2.5 border-t border-line flex items-center justify-between">
      <span class="text-xs font-medium">资产明细</span>
      <span class="text-xs text-ash" id="details-toggle">展开 ›</span>
    </button>
    <div id="asset-details" class="hidden mt-2 space-y-2"></div>
  </div>

  <!-- 收支月历 -->
  <div class="px-5 mb-4">
    <div class="flex items-center justify-between mb-2">
      <button onclick="Finance.prevMonth()" class="w-8 h-8 flex items-center justify-center text-lg text-ash">‹</button>
      <span id="fin-cal-title" class="text-sm font-semibold">2026年8月</span>
      <button onclick="Finance.nextMonth()" class="w-8 h-8 flex items-center justify-center text-lg text-ash">›</button>
    </div>
    <div id="fin-cal-grid" class="grid grid-cols-7 gap-0"></div>
  </div>

  <!-- 收支记录 -->
  <div class="px-5 mb-4">
    <h2 class="text-sm font-semibold mb-2 border-l-2 border-black pl-2">收支记录</h2>
    <div id="finance-records" class="space-y-0"></div>
  </div>

  <!-- 收支统计 -->
  <div class="px-5 mb-4">
    <h2 class="text-sm font-semibold mb-2 border-l-2 border-black pl-2">收支统计</h2>
    <div class="border border-line rounded-lg p-3">
      <div id="finance-chart" class="flex items-end justify-between h-16 gap-0.5"></div>
    </div>
  </div>

  <!-- 存钱计划 -->
  <div class="px-5 mb-6">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-sm font-semibold border-l-2 border-black pl-2">存钱计划</h2>
      <button onclick="Finance.openAddPlan()" class="text-sm">+</button>
    </div>
    <div id="savings-plans" class="space-y-2"></div>
  </div>
</section>

<!-- ========== 我与世界 ========== -->
<section id="page-world" class="page hidden">
  <div class="px-5 pt-8 pb-2">
    <h1 class="text-2xl font-bold tracking-tight">我与世界</h1>
    <p class="text-[10px] text-ash mt-1" id="world-update-time">加载中...</p>
  </div>
  <div class="px-5 mb-2 overflow-x-auto" style="-webkit-overflow-scrolling:touch">
    <div id="world-tabs" class="flex gap-2 pb-1 whitespace-nowrap"></div>
  </div>
  <div id="world-news-list" class="px-5 space-y-0 pb-4"></div>
  <div class="text-center py-6 text-xs text-ash" id="world-loading">正在加载资讯...</div>
</section>

<!-- ========== 专升本专区 ========== -->
<section id="page-edu" class="page hidden">
  <div class="px-5 pt-8 pb-2">
    <h1 class="text-2xl font-bold tracking-tight">专升本</h1>
    <p class="text-[10px] text-ash mt-1" id="edu-update-time">加载中...</p>
  </div>
  <div class="px-5 mb-2 overflow-x-auto" style="-webkit-overflow-scrolling:touch">
    <div id="edu-tabs" class="flex gap-2 pb-1 whitespace-nowrap"></div>
  </div>
  <div id="edu-content" class="px-5 space-y-0 pb-4"></div>
  <div class="text-center py-6 text-xs text-ash" id="edu-loading">正在加载...</div>
</section>

<!-- ========== 我的收藏 ========== -->
<section id="page-fav" class="page hidden">
  <div class="px-5 pt-8 pb-2">
    <h1 class="text-2xl font-bold tracking-tight">收藏</h1>
    <p class="text-[10px] text-ash mt-1" id="fav-count-label"></p>
  </div>
  <div class="px-5 mb-2 overflow-x-auto" style="-webkit-overflow-scrolling:touch">
    <div class="flex gap-2 pb-1 whitespace-nowrap">
      <button onclick="Favorites.setTab('world')" class="fav-tab active px-3 py-1 rounded-full text-xs font-medium">世界</button>
      <button onclick="Favorites.setTab('edu')" class="fav-tab px-3 py-1 rounded-full text-xs font-medium">专升本</button>
      <button onclick="Favorites.setTab('finance')" class="fav-tab px-3 py-1 rounded-full text-xs font-medium">理财</button>
      <button onclick="Favorites.setTab('todo')" class="fav-tab px-3 py-1 rounded-full text-xs font-medium">待办</button>
    </div>
  </div>
  <div id="fav-list" class="px-5 space-y-2"></div>
</section>

</div><!-- /app -->

<!-- ========== 底部导航 ========== -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-line flex justify-around items-center py-2 z-50" style="padding-bottom:env(safe-area-inset-bottom)">
  <button onclick="Nav.go('home')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="home">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
    <span class="text-[9px]">首页</span>
  </button>
  <button onclick="Nav.go('todo')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="todo">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span class="text-[9px]">待办</span>
  </button>
  <button onclick="Nav.go('finance')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="finance">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 8c-2 0-3 1-3 2s1 2 3 2 3 1 3 2-1 2-3 2m0-10v2m0 8v2M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
    <span class="text-[9px]">理财</span>
  </button>
  <button onclick="Nav.go('world')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="world">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
    <span class="text-[9px]">世界</span>
  </button>
  <button onclick="Nav.go('edu')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="edu">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M2 7l10-4 10 4-10 4L2 7zm0 5l10 4 10-4M2 17l10 4 10-4"/></svg>
    <span class="text-[9px]">升本</span>
  </button>
  <button onclick="Nav.go('fav')" class="nav-btn flex flex-col items-center gap-0.5 py-1 px-2" data-page="fav">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0016.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 002 8.5c0 2.29 1.51 4.04 3 5.5l7 7 7-7z"/></svg>
    <span class="text-[9px]">收藏</span>
  </button>
</nav>

<!-- ========== 模态容器 ========== -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/20 z-[100] flex items-end" onclick="Modal.close(event)">
  <div id="modal-box" class="bg-white w-full rounded-t-2xl p-5 max-h-[80vh] overflow-y-auto" style="padding-bottom:calc(env(safe-area-inset-bottom) + 20px)" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
  </div>
</div>

<!-- ========== Toast ========== -->
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-lg text-xs z-[200]"></div>

<!-- ========== Scripts ========== -->
<script src="js/storage.js?v=11"></script>
<script src="js/app.js?v=11"></script>
<script src="js/todo.js?v=11"></script>
<script src="js/finance.js?v=11"></script>
<script src="js/news.js?v=11"></script>
<script src="js/favorites.js?v=11"></script>
<script>
// 安全启动：捕获所有错误避免白屏
window.onerror = function(msg, url, line) {
  console.error('Error:', msg, url, line);
  return true;
};
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=11').catch(function(){});
}
try { App.init(); } catch(e) { console.error('Init error:', e); }
</script>
</body>
</html>
