<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jade</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jade">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json?v=13">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  font-size:15px;color:#000;background:#fafafa;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
  touch-action:manipulation;
  letter-spacing:-.1px;
}
.page{display:none}
.page.active{display:block}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-appearance:none}
input,textarea,select{
  font-family:inherit;font-size:15px;color:#000;background:#fff;
  border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;width:100%;outline:none;
  -webkit-appearance:none;appearance:none;
}
input:focus,textarea:focus,select:focus{border-color:#000}
ul{list-style:none}
a{color:#000;text-decoration:none}

/* 页面容器 */
#app{min-height:100vh;padding-bottom:70px;padding-top:env(safe-area-inset-top);background:#fafafa}

/* 大标题 */
.large-title{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.1}
.title-sub{font-size:13px;color:#8e8e93;margin-top:4px}

/* 分组头部 */
.section-head{
  font-size:13px;font-weight:600;color:#8e8e93;
  padding:24px 20px 10px;
  text-transform:none;
}
.section-head.first{padding-top:16px}

/* 分组卡片 - iOS 风格 */
.group-card{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  overflow:hidden;
}
.group-card .row{
  padding:12px 16px;
  border-bottom:1px solid #f2f2f7;
  display:flex;align-items:center;justify-content:space-between;
}
.group-card .row:last-child{border-bottom:none}
.group-card .row:active{background:#f9f9fb}

/* 首页头部 */
.home-header{padding:20px 20px 16px;background:#fafafa}

/* 日历 */
.calendar-card{
  background:#fff;
  margin:0 16px;
  border-radius:14px;
  padding:16px;
}
.cal-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.cal-month{font-size:17px;font-weight:600;letter-spacing:-.2px}
.cal-nav{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#c7c7cc;
}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  margin-bottom:6px;
}
.cal-weekdays div{
  text-align:center;font-size:11px;color:#c7c7cc;
  padding:4px 0;font-weight:500;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{
  aspect-ratio:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:14px;
  position:relative;
  cursor:pointer;
  border-radius:8px;
  font-weight:400;
}
.cal-cell:active{background:#f9f9fb}
.cal-cell.today{font-weight:600}
.cal-cell.selected{
  background:#000 !important;
  color:#fff !important;
  font-weight:600;
  border-radius:50%;
  width:32px;height:32px;
  margin:auto;
}
.cal-cell.other{color:#d1d1d6}
.cal-dots{
  position:absolute;bottom:4px;
  display:flex;gap:3px;
  font-size:8px;line-height:1;font-weight:700;
}
.cal-cell.selected .cal-dots{color:#fff}

/* 快捷按钮 */
.quick-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;
  margin:0 16px;
}
.quick-btn{
  background:#fff;
  border-radius:12px;
  padding:18px 0;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.quick-btn:active{background:#f9f9fb}
.quick-icon{font-size:26px;line-height:1;font-weight:700}
.quick-label{font-size:13px;color:#000;font-weight:500}

/* 概览数据 */
.stats-row{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  overflow:hidden;
}
.stat{
  padding:14px 8px;text-align:center;
}
.stat+.stat{border-left:1px solid #f2f2f7}
.stat-label{font-size:11px;color:#8e8e93}
.stat-value{font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.2px}

/* 任务列表 */
.task{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;
  border-bottom:1px solid #f2f2f7;
  background:#fff;
}
.task:last-child{border-bottom:none}
.task:active{background:#f9f9fb}
.task-circle{
  width:20px;height:20px;
  border:1.5px solid #c7c7cc;
  border-radius:50%;
  flex-shrink:0;
  margin-top:1px;
  cursor:pointer;
  transition:all .15s;
}
.task-circle.done{
  background:#000;
  border-color:#000;
  position:relative;
}
.task-circle.done::after{
  content:'✓';
  color:#fff;
  font-size:11px;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;line-height:1.4;font-weight:400}
.task-title.done{text-decoration:line-through;color:#c7c7cc}
.task-note{font-size:12px;color:#8e8e93;margin-top:4px}

/* 日期分组 */
.date-label{
  font-size:12px;font-weight:600;color:#8e8e93;
  padding:20px 20px 8px;
  background:#fafafa;
}
.date-label.first{padding-top:12px}
.date-group{background:#fff;margin:0 16px;border-radius:12px;overflow:hidden;margin-bottom:6px}
.date-group+.date-group{margin-top:0}
.overdue-sep{
  text-align:center;
  padding:24px 0 12px;
  font-size:11px;
  color:#c7c7cc;
  letter-spacing:2px;
  background:#fafafa;
}
.overdue .task-title{color:#8e8e93}

/* 底部导航 */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(250,250,250,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.08);
  display:flex;justify-content:space-around;
  padding:6px 0 4px;
  padding-bottom:calc(env(safe-area-inset-bottom) + 4px);
  z-index:100;
}
.tabbar-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;
  color:#c7c7cc;
  padding:2px 10px;
  transition:color .15s;
}
.tabbar-item.active{color:#000}
.tabbar-item svg{width:24px;height:24px}

/* 页面头 */
.page-header{
  padding:20px 20px 12px;
  display:flex;align-items:flex-end;justify-content:space-between;
  background:#fafafa;
}
.add-btn{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  font-weight:300;
  color:#000;
}

/* 理财资产行 */
.asset-row{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  overflow:hidden;
}
.asset-col{
  padding:14px 8px;text-align:center;position:relative;
}
.asset-col+.asset-col{border-left:1px solid #f2f2f7}
.asset-label{font-size:11px;color:#8e8e93}
.asset-num{font-size:15px;font-weight:600;margin-top:3px}
.asset-num.daily-big{font-size:24px;font-weight:700;letter-spacing:-.5px}
.asset-sub{font-size:10px;color:#8e8e93;margin-top:2px}
.asset-plus{
  position:absolute;top:10px;right:6px;
  font-size:14px;color:#c7c7cc;
  font-weight:300;
}

/* 折叠面板 */
.collapse-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  font-size:15px;font-weight:500;
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  cursor:pointer;
}
.collapse-head .arr{
  font-size:12px;color:#c7c7cc;
  transition:transform .2s;
}
.collapse-head.open .arr{transform:rotate(90deg)}

/* 新闻卡片 */
.news-card{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
  cursor:pointer;
}
.news-card:active{background:#f9f9fb}
.news-title{
  font-size:15px;font-weight:500;line-height:1.4;
  margin-bottom:8px;
  letter-spacing:-.1px;
}
.news-desc{
  font-size:13px;color:#8e8e93;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.news-meta{
  font-size:11px;color:#c7c7cc;
  margin-top:10px;
  display:flex;gap:8px;align-items:center;
}
.cn-tag{
  font-size:10px;
  color:#8e8e93;
  background:#f2f2f7;
  padding:2px 6px;
  border-radius:4px;
  font-weight:500;
}

/* 收藏按钮 - 黑白风 */
.fav-col{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  flex-shrink:0;
  cursor:pointer;
  padding:2px 4px;
}
.fav-btn{
  font-size:18px;
  color:#c7c7cc;
  line-height:1;
  transition:all .15s;
}
.fav-btn.on{
  color:#000;
}
.fav-label{
  font-size:10px;
  color:#c7c7cc;
  line-height:1;
}
.fav-col:active .fav-btn{transform:scale(1.1)}

/* 分类标签 */
.tabs{
  padding:8px 20px 12px;
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
  background:#fafafa;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-block;
  padding:6px 14px;
  font-size:13px;
  background:#fff;
  color:#8e8e93;
  border-radius:999px;
  margin-right:6px;
  border:1px solid #e5e5ea;
  font-weight:500;
}
.tab.active{
  background:#000;
  color:#fff;
  border-color:#000;
}

/* 模态弹窗 */
.modal{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  z-index:200;
  align-items:flex-end;
}
.modal.show{display:flex}
.modal-sheet{
  background:#fafafa;
  width:100%;
  border-radius:14px 14px 0 0;
  padding:12px 16px 20px;
  padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
  max-height:85vh;
  overflow-y:auto;
}
.modal-handle{
  width:36px;height:5px;
  background:#e5e5ea;
  border-radius:3px;
  margin:0 auto 12px;
}
.modal-title{
  font-size:17px;font-weight:600;
  margin-bottom:16px;
  text-align:center;
  letter-spacing:-.2px;
}

/* 表单 */
.form-field{margin-bottom:14px}
.form-field label{
  display:block;
  font-size:13px;color:#8e8e93;
  margin-bottom:6px;
  font-weight:500;
}
.form-field input,
.form-field select,
.form-field textarea{
  background:#fff;
  border:1px solid #e5e5ea;
  border-radius:8px;
  padding:10px 12px;
  font-size:15px;
  width:100%;
}

/* 分段控件 */
.seg{
  display:flex;
  background:#e9e9eb;
  border-radius:9px;
  padding:2px;
  margin-bottom:14px;
}
.seg button{
  flex:1;
  padding:7px 0;
  font-size:13px;
  border:none;
  background:transparent;
  color:#000;
  border-radius:7px;
  font-weight:500;
}
.seg button.active{
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  font-weight:500;
}

/* 按钮组 */
.btn-row{
  display:flex;gap:8px;
  margin-top:16px;
}
.btn{
  flex:1;
  padding:12px;
  border-radius:10px;
  font-size:15px;
  font-weight:500;
  border:none;
  cursor:pointer;
  text-align:center;
}
.btn-primary{background:#000;color:#fff}
.btn-primary:active{opacity:.8}
.btn-secondary{background:#fff;color:#000;border:1px solid #e5e5ea}
.btn-danger{background:#fff;color:#ff3b30;border:1px solid #e5e5ea}

/* Toast */
#toast{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.8);
  color:#fff;
  padding:10px 18px;
  border-radius:10px;
  font-size:14px;
  z-index:300;
  display:none;
}
#toast.show{
  display:block;
  animation:toastPop .2s ease;
}
@keyframes toastPop{
  from{opacity:0;transform:translate(-50%,-40%)}
  to{opacity:1;transform:translate(-50%,-50%)}
}

/* 详情页 */
.detail-body{
  padding:8px 4px 16px;
}
.detail-title{
  font-size:17px;font-weight:600;
  line-height:1.4;
  margin-bottom:8px;
  letter-spacing:-.2px;
}
.detail-meta{
  font-size:12px;color:#8e8e93;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid #f2f2f7;
}
.detail-content{
  font-size:14px;
  line-height:1.7;
  color:#000;
}
.detail-content p{margin-bottom:10px}
.detail-content h3{
  font-size:15px;font-weight:600;
  margin:16px 0 8px;
}
.detail-content ul{padding-left:18px;margin-bottom:10px}
.detail-content li{margin-bottom:4px;font-size:14px;line-height:1.6}
.detail-trans{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid #f2f2f7;
}
.detail-trans-label{
  font-size:12px;color:#8e8e93;
  margin-bottom:8px;
  font-weight:500;
}
.detail-trans p{
  font-size:14px;
  color:#3a3a3c;
  line-height:1.7;
  margin-bottom:10px;
}

/* 收支记录行 */
.fin-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid #f2f2f7;
  background:#fff;
}
.fin-row:last-child{border-bottom:none}
.fin-row:active{background:#f9f9fb}
.fin-left{display:flex;align-items:center;gap:12px}
.fin-icon{font-size:18px;width:28px;text-align:center}
.fin-info{flex:1;min-width:0}
.fin-cat{font-size:15px}
.fin-note{font-size:12px;color:#8e8e93;margin-top:2px}
.fin-amount{font-size:15px;font-weight:500}

/* 进度条 */
.pbar{
  height:4px;background:#f2f2f7;
  border-radius:2px;
  overflow:hidden;
  margin-top:8px;
}
.pbar-fill{
  height:100%;background:#000;
  border-radius:2px;
  transition:width .3s ease;
}

/* 存钱计划 */
.plan-item{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:8px;
}
.plan-name{font-size:15px;font-weight:500;margin-bottom:4px}
.plan-amt{font-size:12px;color:#8e8e93;margin-bottom:8px}

/* 收藏 */
.fav-card{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:8px;
}

/* 图表 */
.chart-box{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  padding:16px;
}
.chart{
  display:flex;align-items:flex-end;
  justify-content:space-between;
  gap:2px;
  height:80px;
}
.chart-bar{
  flex:1;
  background:#000;
  border-radius:2px 2px 0 0;
  min-height:2px;
}
.chart-bar.gray{background:#e5e5ea}

/* 空状态 */
.empty{
  text-align:center;
  padding:80px 20px;
  color:#c7c7cc;
  font-size:14px;
}

/* 备份按钮 */
.backup-card{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  padding:14px 16px;
}
.backup-btn{
  width:100%;
  padding:12px;
  background:#000;
  color:#fff;
  border-radius:10px;
  font-size:15px;
  font-weight:500;
  border:none;
  cursor:pointer;
}
.backup-sub{
  display:flex;gap:8px;
  margin-top:10px;
}
.backup-sub button{
  flex:1;
  padding:10px;
  background:#f2f2f7;
  color:#000;
  border-radius:8px;
  font-size:13px;
  border:none;
  cursor:pointer;
}

/* 滚动条隐藏 */
::-webkit-scrollbar{width:0;height:0}

/* 星标 */
.star{font-size:18px;color:#c7c7cc;cursor:pointer;flex-shrink:0}
.star.on{color:#000}

/* 资产明细行 */
.asset-detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;
  border-bottom:1px solid #f2f2f7;
}
.asset-detail-row:last-child{border-bottom:none}
.asset-detail-name{font-size:14px}
.asset-detail-val{font-size:14px;font-weight:500}

/* 理财月历 */
.fincal-card{
  background:#fff;
  margin:0 16px;
  border-radius:12px;
  padding:14px;
}
.fincal-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.fincal-month{font-size:15px;font-weight:600}
.fincal-nav{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#c7c7cc}
</style>
</head>
<body>

<div id="app">

<!-- ===== 首页 ===== -->
<section id="page-home" class="page active">
  <div class="home-header">
    <div class="large-title">Jade</div>
    <div class="title-sub" id="home-date"></div>
  </div>

  <!-- 日历 -->
  <div class="calendar-card">
    <div class="cal-top">
      <button class="cal-nav" onclick="Calendar.prev()">‹</button>
      <div class="cal-month" id="cal-title"></div>
      <button class="cal-nav" onclick="Calendar.next()">›</button>
    </div>
    <div class="cal-weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- 快捷入口 -->
  <div class="section-head">快捷</div>
  <div class="quick-grid">
    <button class="quick-btn" onclick="Nav.go('finance');Finance.openAddRecord()">
      <span class="quick-icon">$</span>
      <span class="quick-label">记账</span>
    </button>
    <button class="quick-btn" onclick="Nav.go('todo');Todo.openAdd()">
      <span class="quick-icon">👣</span>
      <span class="quick-label">待办</span>
    </button>
  </div>

  <!-- 今日概览 -->
  <div class="section-head">今日</div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-label">待办</div>
      <div class="stat-value" id="stat-todo">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">收支</div>
      <div class="stat-value" id="stat-finance">¥0</div>
    </div>
    <div class="stat">
      <div class="stat-label">学习</div>
      <div class="stat-value" id="stat-study">0</div>
    </div>
  </div>

  <!-- 数据备份 -->
  <div class="section-head">数据</div>
  <div class="backup-card">
    <button class="backup-btn" onclick="exportData()">备份全部数据</button>
    <div class="backup-sub">
      <label style="flex:1;display:block">
        <button type="button" style="width:100%" onclick="document.getElementById('import-file').click()">导入恢复</button>
        <input id="import-file" type="file" accept=".json" style="display:none" onchange="importDataFromFile(this.files[0]);this.value=''">
      </label>
      <button onclick="App.clearAllData()">清空数据</button>
    </div>
  </div>

  <div style="height:20px"></div>
</section>

<!-- ===== 待办 ===== -->
<section id="page-todo" class="page">
  <div class="page-header">
    <div>
      <div class="large-title">待办</div>
    </div>
    <button class="add-btn" onclick="Todo.openAdd()">+</button>
  </div>
  <div id="todo-list"></div>
</section>

<!-- ===== 理财 ===== -->
<section id="page-finance" class="page">
  <div class="page-header">
    <div>
      <div class="large-title">理财</div>
